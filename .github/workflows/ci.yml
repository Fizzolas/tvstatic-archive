name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: check / test / clippy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: [stable, "1.75"]   # stable + MSRV (edition 2021 minimum)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: cargo check (all workspace members)
        run: cargo check --workspace --all-features

      - name: cargo test (sllv-core)
        run: cargo test -p sllv-core --all-features -- --nocapture

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --workspace --all-features -- -D warnings
        # Only treat clippy as hard-fail on stable; MSRV may have fewer lints
        if: matrix.toolchain == 'stable'
