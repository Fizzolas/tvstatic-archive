[workspace]
resolver = "2"

members = [
  "crates/sllv-core",
  "crates/sllv-cli",
  "crates/sllv-gui",
]

[workspace.package]
# Minimum Supported Rust Version.  Rust 1.85 is the floor because transitive
# deps require edition2024 (stabilised in 1.85).  Matches rust-toolchain.toml
# and the ci.yml MSRV matrix entry — keep all three in sync when bumping.
rust-version = "1.85"

# Centralise shared dependency versions here so every crate
# uses the same version without risk of drift.
[workspace.dependencies]
anyhow      = "1"
tar         = "0.4"
thiserror   = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
crc32fast   = "1"
image       = "0.25"
# clap 4.6+ requires edition2024 (fine now that our MSRV is 1.85)
clap        = { version = ">=4.0, <5", features = ["derive"] }
reed-solomon-erasure = "6"
nalgebra    = "0.33"
walkdir     = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
