[workspace]
resolver = "2"

members = [
  "crates/sllv-core",
  "crates/sllv-cli",
  "crates/sllv-gui",
]

# Centralise shared dependency versions here so every crate
# uses the same version without risk of drift.
[workspace.dependencies]
anyhow      = "1"
tar         = "0.4"
thiserror   = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
crc32fast   = "1"
image       = "0.25"
# Pin clap below 4.6 — clap 4.6+ requires Cargo/edition2024 which is not
# stabilised until Rust >= 1.85.  The CI runner uses 1.75; keep this pin
# until the toolchain is updated.
clap        = { version = ">=4.0, <4.6", features = ["derive"] }
reed-solomon-erasure = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
